# 행정안전부 「소프트웨어 보안약점 진단가이드」(2021) 구현단계 보안약점 49개 항목
# 출처: KISA https://www.kisa.or.kr/2060204/form?postSeq=9
# TODO: 항목 명칭·순서를 원문 PDF와 최종 대조할 것 (현재는 2021판 목차 기준 정리본)
#
# js: JS/TS 자동 점검 범위
#   auto    - 규칙으로 자동 탐지
#   partial - 일부 패턴만 자동 탐지, 나머지는 사람이 확인
#   na      - JS/TS 런타임 특성상 성립하지 않음(메모리 관리 등)
#   manual  - 코드만으로 판단 불가, 문답 체크리스트로 확인
# cwe: 외부 규칙(Semgrep 레지스트리 등)의 CWE 메타데이터를 이 항목으로 묶는 데 쓴다

