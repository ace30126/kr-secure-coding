# 코드로 판단할 수 없는 관리적·인적·물리적 보안 문답
# 저장소의 .kr-secure-coding/checklist.yml 에 답을 적으면 보고서에 반영된다 (yes / no / na)
# isms: ISMS-P 인증기준 참고 항목 (소규모 SaaS 해당분만 발췌)
# mois: 이 문답으로 확인하는 행안부 49 항목(js: manual)

areas:
  AD: 관리적 보안
  PE: 인적 보안
  PH: 물리적 보안
  PR: 개인정보

questions:
  - id: AD-01
    area: AD
    q: GitHub·호스팅(Vercel 등)·DB(Supabase 등)·도메인 등록처의 관리자 계정에 2단계 인증(MFA)을 켰나요?
    why: 바이브코딩 서비스 사고의 상당수는 코드가 아니라 관리 계정 탈취에서 시작합니다.
    isms: "2.5.3 사용자 인증"
  - id: AD-02
    area: AD
    q: 서비스 로그인에 최소 비밀번호 길이(8자 이상) 같은 규칙을 걸었나요? (Supabase·Clerk 등 인증 서비스 설정 포함)
    why: 짧은 비밀번호를 허용하면 대입 공격에 바로 뚫립니다.
    isms: "2.5.4 비밀번호 관리"
    mois: SF-09
  - id: AD-03
    area: AD
    q: 로그인 실패가 반복되면 막거나 늦추는 장치(rate limit·잠금·캡차)가 있나요?
    why: 시도 횟수 제한이 없으면 비밀번호를 무한히 대입할 수 있습니다.
    isms: "2.5.3 사용자 인증"
    mois: SF-16
  - id: AD-04
    area: AD
    q: API 키가 유출되면 어디서 폐기·재발급하는지 정리해 두었고, 사람이 바뀔 때 키를 교체하나요?
    why: 유출 사실을 알아도 어디서 끄는지 몰라 대응이 늦어지는 경우가 많습니다.
    isms: "2.7.2 암호키 관리"
  - id: AD-05
    area: AD
    q: DB 백업이 자동으로 돌고, 실제로 복구해 본 적이 있나요?
    why: 랜섬웨어·실수로 인한 삭제 때 복구해 본 적 없는 백업은 없는 것과 같습니다.
    isms: "2.9.3 백업 및 복구관리"
  - id: AD-06
    area: AD
    q: 로그인·관리자 작업 기록(로그)을 일정 기간 보관하나요?
    why: 사고가 나도 로그가 없으면 무엇이 털렸는지 알 수 없습니다.
    isms: "2.9.4 로그 및 접속기록 관리"
  - id: AD-07
    area: AD
    q: 사고가 났을 때 할 일(키 폐기, 서비스 중지, 사용자 공지, 신고처)을 한 장으로라도 적어 두었나요?
    why: 개인정보 유출은 법정 신고 기한이 있어 그때 찾아보면 늦습니다.
    isms: "2.11.1 사고 예방 및 대응체계 구축"
  - id: PE-01
    area: PE
    q: 외주 개발자·공동작업자의 저장소·클라우드 권한을 작업이 끝나면 회수하나요?
    why: 끝난 협업자의 권한이 남아 있는 것이 소규모 팀의 대표적인 구멍입니다.
    isms: "2.2.5 퇴직 및 직무변경 관리"
  - id: PE-02
    area: PE
    q: 협업자에게 꼭 필요한 권한만 주나요? (모두에게 Owner·Admin을 주지 않음)
    why: 권한이 넓을수록 계정 하나가 털렸을 때 피해가 커집니다.
    isms: "2.5.1 사용자 계정 관리"
  - id: PH-01
    area: PH
    q: 서비스를 ISO 27001이나 SOC 2 인증을 받은 클라우드(AWS·GCP·Vercel·Supabase 등)에서 운영하나요?
    why: SaaS의 물리 보안은 클라우드 사업자 몫(공유책임모델)이라, 인증받은 사업자를 쓰는지가 핵심입니다.
    isms: "2.4 물리보안"
  - id: PH-02
    area: PH
    q: 개발에 쓰는 노트북에 화면 잠금과 디스크 암호화(BitLocker·FileVault)를 켰나요?
    why: 노트북을 잃어버리면 그 안의 .env 와 로그인된 관리 콘솔이 그대로 넘어갑니다.
    isms: "2.10.6 업무용 단말기기 보안"
  - id: PR-01
    area: PR
    q: (개인정보를 받는다면) 개인정보 처리방침을 서비스에 게시했나요?
    why: 이메일 하나만 받아도 개인정보보호법상 처리방침 공개 의무가 생깁니다.
    isms: "3.5.1 개인정보처리방침 공개"
  - id: PR-02
    area: PR
    q: (개인정보를 받는다면) 탈퇴하거나 보관기간이 지난 개인정보를 지우나요?
    why: 필요 없어진 개인정보를 쌓아 두면 유출 때 피해 규모만 커집니다.
    isms: "3.4.1 개인정보의 파기"
