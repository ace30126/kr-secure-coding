# 항목별 "왜 위험한가(why)" + "어떻게 고치나(how)"
# how 는 AI 코딩 도구에 붙여넣는 수정 프롬프트의 지시문으로 그대로 들어간다

_default:
  why: "보안약점으로 분류되는 코드 패턴입니다."
  how: "이 코드가 왜 위험한지 설명하고, 같은 기능을 유지하면서 안전한 방식으로 고쳐줘."

IV-01:
  why: "사용자가 입력한 값이 SQL 문장의 일부가 되면, 공격자가 조건을 바꿔 다른 사람 데이터를 조회·삭제할 수 있습니다."
  how: "문자열을 이어 붙여 SQL을 만들지 말고, 파라미터 바인딩($1, ?)이나 ORM의 쿼리 빌더로 바꿔줘. 테이블·컬럼 이름이 입력값이라면 허용 목록과 비교해."
IV-02:
  why: "문자열을 코드로 실행하면, 그 문자열을 조작한 사람이 서버나 브라우저에서 원하는 코드를 돌릴 수 있습니다."
  how: "eval·new Function·문자열 setTimeout을 없애고, JSON.parse나 명시적인 분기 로직으로 같은 기능을 구현해줘."
IV-03:
  why: "파일 이름에 ../ 를 넣으면 업로드 폴더 밖의 서버 파일(.env 등)을 읽거나 지울 수 있습니다."
  how: "입력값에서 path.basename()으로 파일 이름만 꺼내고, path.resolve 결과가 허용 디렉터리 안에 있는지 확인하는 코드를 넣어줘."
IV-04:
  why: "사용자가 쓴 글에 스크립트가 섞여 있으면 다른 사용자의 브라우저에서 실행되어 세션이 탈취됩니다."
  how: "가능하면 HTML을 직접 넣지 말고 텍스트로 렌더링해줘. HTML이 꼭 필요하면 DOMPurify.sanitize()를 거친 값만 넣어줘."
IV-05:
  why: "셸 명령 문자열에 입력값이 섞이면 ; 나 && 로 다른 명령을 이어 붙여 서버를 장악할 수 있습니다."
  how: "exec/execSync 대신 execFile이나 spawn에 인자 배열로 넘기고 shell 옵션은 끄도록 바꿔줘. 입력값은 허용 문자만 통과시켜."
IV-07:
  why: "로그인 후 이동할 주소 같은 값을 그대로 쓰면, 정상 사이트 링크로 피싱 사이트에 보낼 수 있습니다."
  how: "리다이렉트 주소를 허용 경로 목록과 비교하거나, / 로 시작하는 내부 경로만 허용하도록 고쳐줘."
IV-08:
  why: "XML 외부 엔티티를 허용하면 XML 안에서 서버 파일이나 내부망 주소를 불러올 수 있습니다."
  how: "XML 파서 옵션에서 noent·외부 엔티티 해석을 끄고, 가능하면 JSON으로 바꿔줘."
IV-12:
  why: "서버가 사용자가 준 주소로 요청을 보내면, 클라우드 메타데이터(169.254.169.254)나 내부 서비스에 접근하는 통로가 됩니다."
  how: "요청 대상 도메인을 허용 목록으로 제한하고, 사설·루프백·링크로컬 IP로 해석되는 주소는 막는 코드를 넣어줘."
IV-13:
  why: "헤더 값에 줄바꿈이 섞이면 응답이 둘로 쪼개져 가짜 응답이나 쿠키를 심을 수 있습니다."
  how: "헤더에 넣는 값에서 \\r \\n 을 제거하거나 허용 값 목록으로 제한해줘."

SF-01:
  why: "데이터를 바꾸는 API에 로그인 확인이 없으면, 주소만 알면 누구나 호출할 수 있습니다."
  how: "이 핸들러 맨 앞에서 세션(또는 Supabase auth.getUser())을 확인하고, 로그인하지 않았으면 401을 돌려주도록 고쳐줘. 다른 사용자의 데이터를 바꾸지 못하게 소유자도 확인해."
SF-04:
  why: "MD5·SHA-1·DES·ECB 모드는 이미 깨졌거나 패턴이 드러나는 방식입니다."
  how: "해시는 SHA-256 이상, 암호화는 crypto의 aes-256-gcm(무작위 IV 포함)으로 바꿔줘. 비밀번호 저장 용도라면 bcrypt나 argon2를 써."
SF-06:
  why: "저장소에 들어간 키는 공개 저장소면 즉시, 비공개여도 협업자·유출 경로로 퍼집니다. 지워도 git 기록에 남습니다."
  how: "이 값을 환경변수로 옮기고 코드에서는 process.env로 읽게 바꿔줘. .env 는 .gitignore 에 넣어. (키 자체는 발급처에서 반드시 폐기·재발급해야 한다는 점도 알려줘.)"
SF-07:
  why: "짧은 키는 계산으로 풀 수 있습니다."
  how: "RSA modulusLength 를 3072 이상으로 올리거나 Ed25519로 바꿔줘."
SF-08:
  why: "Math.random()은 예측할 수 있어서, 비밀번호 재설정 토큰 같은 값을 공격자가 맞힐 수 있습니다."
  how: "보안 용도의 난수는 crypto.randomUUID() 또는 crypto.getRandomValues()(Node는 crypto.randomBytes)로 바꿔줘."
SF-10:
  why: "서명을 검사하지 않으면 누구나 내용을 고친 토큰으로 다른 사람 행세를 할 수 있습니다."
  how: "jwt.decode 대신 jwt.verify(token, secret, { algorithms: [\"HS256\"] }) 로 검증하고, 실패하면 401을 돌려주게 고쳐줘."
SF-11:
  why: "인증서 검증을 끄면 중간에서 통신을 가로채도 알 수 없습니다."
  how: "rejectUnauthorized 를 지우고, 사설 인증서가 필요하면 ca 옵션으로 해당 인증서만 신뢰하도록 바꿔줘."
SF-12:
  why: "httpOnly가 없으면 XSS 한 번에 세션 쿠키가 털리고, secure가 없으면 평문 HTTP로 전송됩니다."
  how: "세션·인증 쿠키는 httpOnly true, secure true, sameSite \"lax\" 이상으로 설정하도록 고쳐줘."
SF-14:
  why: "솔트 없는 해시는 미리 계산된 표(레인보우 테이블)로 몇 초 만에 원래 비밀번호가 나옵니다."
  how: "비밀번호 저장을 bcrypt(비용 12 이상)나 argon2id로 바꾸고, 로그인 검증도 해당 라이브러리의 compare/verify로 바꿔줘."

EH-01:
  why: "오류의 stack에는 서버 파일 경로·라이브러리 버전이 담겨 공격 준비 정보가 됩니다."
  how: "사용자에게는 일반 오류 메시지와 오류 ID만 돌려주고, 상세 내용은 서버 로그에만 남기도록 고쳐줘."
EH-02:
  why: "예외를 조용히 삼키면 인증·결제·저장 실패가 성공처럼 지나갑니다."
  how: "catch 블록에서 최소한 로그를 남기고, 실패가 사용자 흐름에 영향을 주면 오류를 다시 던지거나 적절한 응답을 돌려주게 고쳐줘."
CE-05:
  why: "node-serialize 같은 역직렬화는 데이터 안의 함수까지 실행해 원격 코드 실행으로 이어집니다."
  how: "해당 라이브러리를 제거하고 JSON.parse + 스키마 검증(zod 등)으로 바꿔줘."
EN-02:
  why: "콘솔에 찍힌 비밀번호·토큰은 브라우저 개발자도구나 서버 로그 수집 서비스에 그대로 남습니다."
  how: "민감 값을 찍는 console.* 와 debugger 를 지우고, 필요한 로그는 값을 마스킹해서 남기게 고쳐줘."
AM-02:
  why: "알려진 취약점이 있는 버전의 라이브러리는 공개된 공격 코드로 바로 공격당할 수 있습니다."
  how: "package.json 에서 이 패키지를 취약점이 고쳐진 버전으로 올리고, 깨지는 API가 있으면 같이 수정해줘."

VC-01:
  why: "NEXT_PUBLIC_·VITE_ 로 시작하는 환경변수와 \"use client\" 파일의 값은 빌드할 때 브라우저 JS 파일에 그대로 들어갑니다. 개발자도구만 열면 누구나 키를 봅니다."
  how: "이 키를 쓰는 코드를 서버(API 라우트·서버 액션·Edge Function)로 옮기고, 브라우저는 그 서버 API만 호출하게 바꿔줘. 변수 이름에서 공개 접두사를 빼. (이미 배포됐다면 키를 폐기·재발급해야 한다는 점도 알려줘.)"
VC-02:
  why: "Supabase 테이블에 RLS가 없거나 Firebase 규칙이 if true 면, 앱에 들어 있는 공개 anon 키만으로 DB 전체를 읽고 쓸 수 있습니다."
  how: "이 테이블에 row level security 를 켜고, auth.uid() 로 본인 행만 읽고 쓰게 하는 정책을 마이그레이션으로 추가해줘. Firebase라면 request.auth != null 과 소유자 비교 조건으로 규칙을 고쳐줘."
VC-03:
  why: "CORS를 * 로 열면 아무 사이트에서나 이 API를 호출할 수 있습니다."
  how: "허용할 도메인 목록을 환경변수로 받아 origin 에 지정하도록 고쳐줘."
VC-04:
  why: "__proto__ 같은 키로 객체 기본 동작을 오염시켜 권한 검사를 우회할 수 있습니다."
  how: "사용자 입력을 객체에 병합할 때 __proto__·constructor·prototype 키를 걸러내거나 Object.create(null)·Map을 쓰도록 고쳐줘."
